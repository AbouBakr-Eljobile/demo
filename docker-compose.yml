services:
  backend:
    build:
      context: ./backend
      dockerfile: GovContracts.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  frontend:
    build:
      context: ./frontend/GovContracts.Web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
